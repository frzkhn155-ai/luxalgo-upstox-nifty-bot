name: LuxAlgo NIFTY Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'paper (no real orders) or live'
        type: choice
        options:
          - paper
          - live
        required: true
        default: paper
      qty:
        description: 'Quantity / lot size (positive integer)'
        type: string
        required: true
        default: '65'

permissions:
  contents: read

jobs:
  luxalgo:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          QTY: ${{ inputs.qty }}
        run: |
          case "$MODE" in
            paper|live) ;;
            *) echo "Invalid mode: $MODE" >&2; exit 1 ;;
          esac
          python -c 'import sys; n = int(sys.argv[1]); sys.exit(0 if 0 < n <= 100000 else 1)' "$QTY"

      - name: Run LuxAlgo NIFTY engine
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TZ: Asia/Kolkata
          MODE: ${{ inputs.mode }}
          QTY: ${{ inputs.qty }}
        run: |
          python -u luxalgo_upstox_production.py \
            --mode "$MODE" \
            --qty "$QTY" \
            2>&1 | tee luxalgo_console.log

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxalgo-run-logs-${{ github.run_id }}
          path: |
            luxalgo_live_production.log
            luxalgo_console.log
          if-no-files-found: ignore
          retention-days: 3
